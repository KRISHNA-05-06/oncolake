version: 2
models:
  - name: fct_diagnoses
    columns:
      - name: diagnosis_id
        tests: [not_null, unique]
      - name: patient_id
        tests: [not_null]
  - name: cohort_data_mart
    columns:
      - name: patient_id
        tests: [not_null]
      - name: ajcc_stage
        tests:
          - accepted_values:
              values: ['I','II','IIA','IIB','III','IIIA','IIIB','IV']